<div class="footer_wrap">
  <div class="footer">
  <!-- data-* 속성 : data-footer-rural-stay-mark-wrap (customFields.footer.ruralStayMarks 또는 기존 ruralStayMark 가 있을 때만 노출)
         data-footer-rural-stay-mark : 농어촌민박사업자 이미지 (표시마크 + 신고번호, alt = description) -->
    <div class="ft_rural_stay_mark_wrap" data-footer-rural-stay-mark-wrap style="display: none">
      <img class="ft_rural_stay_mark" alt="농어촌민박사업자" data-footer-rural-stay-mark />
      <img class="ft_rural_stay_mark" alt="농어촌민박사업자" data-footer-rural-stay-mark />
    </div>
    <div class="tel">
      <a class="tpl-slot" href="tel:" data-footer-phone-link>
        T.
        <span class="tpl-slot" data-footer-phone></span>
      </a>
    </div>
    <div class="address">
      <p>
        주소 :
        <span class="tpl-slot" data-footer-address></span>
      </p>
      <p>
        업체명 :
        <span class="tpl-slot" data-footer-business-name></span>
      </p>
      <br class="for_m" />
      <p>
        대표자 :
        <span class="tpl-slot" data-footer-representative></span>
      </p>
      <p>
        사업자번호 :
        <span class="tpl-slot" data-footer-business-number></span>
      </p>
      <p data-ybs-wrap>
        <a class="tpl-slot" href="#!" target="_blank" data-ybs-button>야놀자 YBS</a>
      </p>
    </div>
    <!-- 원본 .calendar 는 실시간 달력(bookingplay) + 개인정보처리방침 2개였다.
         달력 링크는 bookingplay 파트너 번호가 URL 에 박힌 값이라 데이터로 만들 수 없어
         가져오지 않는다. 개인정보처리방침만 남긴다. -->
    <div class="calendar">
      <a
        href="http://design.trip11.net/privacy/privacy_policy.html"
        class="privacy"
        target="_blank"
      >
        개인정보처리방침
      </a>
    </div>
  </div>
  <div class="copy">
    <a href="http://trip11.kr/" target="_blank" data-copyright="COPYRIGHT©{provider}. ALL RIGHTS RESERVED.">COPYRIGHT©(주)트립일레븐. ALL RIGHTS RESERVED.</a>
  </div>
</div>

<!-- 우측 하단 플로팅 버튼 2개. 상담하기(아래) + 예약하기(위) 순으로 쌓인다.
     예약하기는 `for_m` 이라 모바일에서만 뜨고, 상담하기는 총판A + tripPropertyId 가
     있을 때 전 화면폭에서 뜬다 (header-footer-mapper.mapConsult). -->

<!-- data-* 속성 : data-consult-button (property.tripPropertyId + partnerType)
     상담 URL 은 `https://www.bookingplay.co.kr/api/cti_eicn/kakao_happy_talk?tid={tripPropertyId}` -->
<div id="talk_custom_button" data-consult-wrap>
  <a title="상담하기" href="#!" target="_blank" data-consult-button>
    <img src="images/common/consult.png" alt="상담하기" />
  </a>
</div>

<!-- data-* 속성 : data-booking-link (property.realtimeBookingId) -->
<div class="ft_btn_reserve for_m on">
  <a title="예약하기" href="#!" target="_blank" data-booking-link>
    <img src="images/common/talk.png" alt="예약하기" />
  </a>
</div>
