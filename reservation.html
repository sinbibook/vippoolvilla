  <body oncontextmenu="return false;" onselectstart="return false" ondragstart="return false;">
    <div id="wrap">
      <div id="header-wrap"></div>

      <div id="container">
        <section id="content" class="sub4_1 sub_reserve">
          <div class="sub_visual_wide" data-reservation-hero>
            <div class="sub_location_wrap">
              <h3>RESERVE</h3>
              <p data-reservation-hero-description></p>
              <ul class="location_box">
                <li>홈</li>
                <li>RESERVE</li>
                <li><a href="./reservation.html">이용안내</a></li>

                <li class="on"><a href="./reservation.html">이용안내</a></li>
              </ul>
            </div>
          </div>

          <div class="sub_cont inner">
            <!-- 원본은 dt(제목) + dd(사진 + 본문)를 두 벌 쓴다.
                 사진 위 라벨은 CSS 가 넣는다 — .info_box dd .img:after 가 `펜션정보`,
                 :nth-of-type(2) 가 `환불정보`. 그래서 dd 순서를 바꾸면 안 된다. -->
            <dl class="info_box">
              <dt class="sub_title_box"><h4>INFORMATION</h4></dt>
              <dd>
                <div class="img" data-reservation-info-image></div>
                <p data-reservation-info-body></p>
              </dd>
              <dt class="sub_title_box"><h4>REFUND INFO</h4></dt>
              <dd>
                <div class="img" data-reservation-refund-image></div>
                <p data-reservation-refund-body></p>
              </dd>
            </dl>
          </div>
          <!--// sub_cont -->
        </section>
